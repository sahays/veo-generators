store:
  backend: "memory"
  firestore_database: "(default)"
  collection_prefix: "veo_generators_productions"
  max_doc_bytes: 900000

blobs:
  backend: "local"
  local_root: "/tmp/storygraph_blobs"
  gcs_prefix: "projects"

models:
  story_architect: "gemini-3.8-flash"
  script_supervisor: "gemini-3.8-flash"
  screenwriter: "gemini-3.8-flash"
  character_designer: "gemini-3.8-flash"
  location_designer: "gemini-3.8-flash"
  object_designer: "gemini-3.8-flash"
  designer: "gemini-3.8-flash"
  director: "gemini-3.8-flash"
  music_director: "gemini-3.8-flash"
  critic_vlm: "gemini-3.8-flash"

image:
  provider: "mock"
  model: "gemini-nano-banana-2.1"

video:
  provider: "mock"
  model: "gemini-omni-1.1-flash-preview"
  # Omni docs show 6 reference images per request (Veo 3.1 caps at 3).
  max_reference_images: 6
  max_duration_s: 10.0
  supports_first_frame: true
  first_frame_mode: "tag"
  # "hybrid" (default; docs/eval/prompt_ab_v1.md winner) | "json" (legacy spec JSON).
  prompt_format: "hybrid"
  # "keyframe_anchored" (default; v2 winner) | "keyframe_anchored_text" | "direct" |
  # "keyframe_interp" | "animatic_edit" (see docs/eval/keyframe_strategy_v1.md).
  render_strategy: "keyframe_anchored"
  keyframe_stride_s: 3

  supports_audio_prompt: true

qa:
  face_cosine_min: 0.65
  wardrobe_vlm_min: 0.70
  setting_vlm_min: 0.70
  action_vlm_min: 0.70
  dialogue_wer_max: 0.15
  retry_rewrite_llm: false

caps:
  shot_max_retries: 3
  design_loop_max: 2
  max_words_per_sec: 2.8
  max_composite_subjects: 2
  stage_token_cap: 500000
  project_cost_cap_usd: 50.0

assembly:
  music_enabled: true
  music_gain: 0.35
  music_crossfade_s: 1.5
  duck_threshold: 0.05
  duck_ratio: 8.0

# Clip audio (storygraph/audio): "stems" = Omni audio is a timing guide only; final audio is
# fixed-voice TTS dialogue + demucs SFX stem + S5 music ducked under dialogue in S10.
# Winner of docs/eval/voiceover_sync_v1.md v5 (0 leftover Omni voice, SFX kept).
audio:
  mode: "stems"             # omni | voiceover_duck | stems
  speech_removal: "duck"    # duck | demucs (optional torch runtime)
  tts_model: "gemini-2.5-flash-tts"
  duck_db: -26.0
  pace_factor: 0.85         # TTS paced to 0.85x Omni's speech window
  residual_db: -24.0        # stems: SFX stem ducked where demucs vocals are active
  dialogue_lufs: -16.0
  sfx_lufs: -24.0
  music_lufs: -26.0
  tempo_min: 0.8
  tempo_max: 1.35
  voice_lufs: -16.0

# Video-eval gate (storygraph/eval): identical thresholds on every attempt.
# Hard-gated dimensions block when score < threshold (with confidence >= min_confidence).
# demote_high_defects: that dimension's HIGH defects count as MEDIUM in the defect gate.
# Calibrated against golden set golden-v1 (eval_data/golden/v1, 66 clips, agent labels pending
# human review): see docs/eval/eval_calibration_v1.md. Pre-calibration gate is frozen in
# docs/eval/eval_calibration_v1/baseline_gate_v0.yaml. Re-run the calibration before changing.
eval:
  overall_threshold: 0.65
  min_confidence: 0.3
  max_medium_defects: 3
  dimensions:
    character_consistency: {threshold: 0.7, weight: 0.16, hard_gate: true, evidence_margin: 0.15}
    temporal_consistency: {threshold: 0.6, weight: 0.10, hard_gate: true}
    spatial_consistency: {threshold: 0.5, weight: 0.05, hard_gate: false}
    scene_consistency: {threshold: 0.6, weight: 0.07, hard_gate: false}
    object_permanence: {threshold: 0.6, weight: 0.12, hard_gate: true, demote_high_defects: true}
    physical_plausibility: {threshold: 0.6, weight: 0.07, hard_gate: false}
    action_adherence: {threshold: 0.6, weight: 0.14, hard_gate: false, demote_high_defects: true}
    camera_adherence: {threshold: 0.0, weight: 0.03, hard_gate: false}
    style_consistency: {threshold: 0.6, weight: 0.06, hard_gate: false}
    audio: {threshold: 0.5, weight: 0.05, hard_gate: false}
    script_adherence: {threshold: 0.6, weight: 0.15, hard_gate: false}
