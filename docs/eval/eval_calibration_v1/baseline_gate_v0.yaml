# Pre-calibration eval gate (storygraph/config/default.yaml `eval:` before golden v1 calibration).
# Baseline for `python -m storygraph.eval.calibration report --base-config <this file>`.
eval:
  overall_threshold: 0.65
  min_confidence: 0.3
  max_medium_defects: 2
  dimensions:
    character_consistency: {threshold: 0.65, weight: 0.16, hard_gate: true}
    temporal_consistency: {threshold: 0.6, weight: 0.10, hard_gate: true}
    spatial_consistency: {threshold: 0.5, weight: 0.05, hard_gate: false}
    scene_consistency: {threshold: 0.6, weight: 0.07, hard_gate: false}
    object_permanence: {threshold: 0.6, weight: 0.12, hard_gate: true}
    physical_plausibility: {threshold: 0.6, weight: 0.07, hard_gate: false}
    action_adherence: {threshold: 0.6, weight: 0.14, hard_gate: true}
    camera_adherence: {threshold: 0.0, weight: 0.03, hard_gate: false}
    style_consistency: {threshold: 0.6, weight: 0.06, hard_gate: false}
    audio: {threshold: 0.5, weight: 0.05, hard_gate: false}
    script_adherence: {threshold: 0.6, weight: 0.15, hard_gate: true}
